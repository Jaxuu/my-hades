<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-hades · roguelike run (M9-T01)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161c;
        color: #e6e6e6;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #app {
        position: absolute;
        inset: 0;
      }

      #app canvas {
        display: block;
      }

      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
        white-space: pre;
      }

      #keys {
        position: absolute;
        bottom: 12px;
        left: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
      }

      /* M9-T01 · gold read-out. The one always-on HUD element the UIManager owns;
         top-right so it never collides with the diagnostics block on the left. */
      #gold {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 210, 77, 0.45);
        background: rgba(0, 0, 0, 0.55);
        color: #ffd24d;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        pointer-events: none;
        white-space: pre;
      }

      /* M6-T01 · boon-draft overlay. Hidden unless a draft is pending; the
         UIManager toggles `is-visible`. It covers the whole viewport so a click
         can never fall through to the canvas while the player is choosing. */
      #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(8, 10, 14, 0.62);
        font-family: inherit;
      }

      #ui-layer.is-visible {
        display: flex;
      }

      #ui-layer h2 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 600;
        color: #e6e6e6;
        letter-spacing: 0.06em;
      }

      .reward-button {
        min-width: 220px;
        padding: 12px 20px;
        border: 1px solid #4da3ff;
        border-radius: 8px;
        background: rgba(77, 163, 255, 0.14);
        color: #e6e6e6;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
        transition: background 120ms ease, transform 120ms ease;
      }

      .reward-button:hover {
        background: rgba(77, 163, 255, 0.32);
        transform: translateY(-1px);
      }

      .reward-button:active {
        transform: translateY(0);
      }

      /* M8-T01 · death overlay. Same root element as the draft overlay (only one
         is ever on screen), restyled into a terminal state: a deep red wash, a
         wide-tracked heading, and a hint line. */
      #ui-layer.is-death {
        background: rgba(34, 4, 6, 0.86);
      }

      #ui-layer.is-death h2 {
        font-size: 34px;
        font-weight: 700;
        color: #ff5a5a;
        letter-spacing: 0.22em;
        text-shadow: 0 0 18px rgba(255, 60, 60, 0.45);
      }

      #ui-layer .death-hint {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.1em;
        color: #e6e6e6;
        opacity: 0.85;
      }

      /* M9-T01 · victory overlay. Same root element and same structure as the death
         overlay (only one is ever on screen), restyled into a positive terminal
         state: a deep teal wash and a wide-tracked gold heading. Deliberately the
         OPPOSITE temperature from `is-death`, so the two endings are never mistaken
         for one another at a glance. */
      #ui-layer.is-win {
        background: rgba(4, 30, 28, 0.86);
      }

      #ui-layer.is-win h2 {
        font-size: 34px;
        font-weight: 700;
        color: #ffd24d;
        letter-spacing: 0.22em;
        text-shadow: 0 0 18px rgba(255, 210, 77, 0.45);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-layer"></div>
    <div id="hud"></div>
    <div id="gold"></div>
    <div id="keys">
      W A S D 移动 &nbsp;·&nbsp; J 攻击 &nbsp;·&nbsp; K 冲刺 &nbsp;·&nbsp; R 重开（终局后）
    </div>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
