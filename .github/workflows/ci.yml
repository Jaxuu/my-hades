name: CI

# Enforces the architectural rules declared in docs/architecture/ADR-001-headless-ecs-foundation.md
# and the acceptance criteria in specs/00_harness_spec.md + specs/01_character_controller_spec.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # Guard against the M0 R1 defect class: `npm ci` is strictly lockfile-driven and
      # SILENTLY SKIPS platform optional deps that are missing from the lockfile
      # (exit code stays 0), after which vitest dies with MODULE_NOT_FOUND.
      # See ADR-001 §6 and specs/00_harness_spec.md.
      - name: Lockfile platform coverage guard
        run: |
          set -euo pipefail
          missing=0
          for pkg in "@esbuild/linux-x64" "@rollup/rollup-linux-x64-gnu"; do
            if grep -q "\"node_modules/${pkg}\"" package-lock.json; then
              echo "OK   ${pkg}"
            else
              echo "::error::package-lock.json is missing ${pkg} — npm ci would silently skip it."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Regenerate the lockfile in an isolated dir without node_modules (see ADR-001 §6)."
            exit 1
          fi

      - name: Typecheck (TypeScript strict)
        run: npm run typecheck

      # Runs the whole suite, including the QA-owned adversarial suite
      # tests/harness/independent-verify.test.ts (structural independence: own
      # fixtures, own assertions — see ADR-001 §6.1).
      - name: Unit tests (Vitest, node environment)
        run: npm run test

      # ADR-001 rules R1 + R2 + R6: the simulation core must stay headless,
      # wall-clock free and free of environment-dependent comparisons, otherwise
      # determinism and replay silently break.
      #
      # M2-T02 tech-debt fix: this gate was previously a `grep -rnE` over src/ that
      # matched a REGEX against raw text. That false-positived on ordinary prose in
      # comments (e.g. a sentence ending in "window."), forcing comment-wording
      # gymnastics. It is now an ESLint AST gate (eslint.config.mjs) scoped to
      # `src/**/*.ts`: no-restricted-globals (window, document),
      # no-restricted-properties (Math.random, Date.now) and no-restricted-syntax
      # (new Date(), localeCompare, toLocale*, Intl). AST nodes cannot be confused
      # with comments, so the gate is both precise and false-positive free, while
      # every prohibition is strictly preserved.
      - name: Lint (ESLint AST gate — no DOM / wall-clock / randomness / locale API in src/)
        run: npm run lint
